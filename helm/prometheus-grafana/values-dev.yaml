## Development-only kube-prometheus-stack configuration.
## Grafana and Prometheus are not exposed outside the cluster.

alertmanager:
  enabled: false # CloudWatch alarms already provide the lab alerting path.

defaultRules:
  create: true # Dashboards depend on recording rules; Alertmanager notifications remain disabled above.

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    #checkov:skip=CKV_SECRET_6: This is a Kubernetes Secret key name, not a password; deployment injects the value from the GitHub Actions secret.
    passwordKey: admin-password
  ingress:
    enabled: false
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      searchNamespace: observability
  persistence:
    enabled: false # Lab data is ephemeral; no EBS volume is created.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 768Mi

prometheus:
  enabled: true
  service:
    type: ClusterIP
  prometheusSpec:
    replicas: 1
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 7d
    retentionSize: 2GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    # No persistent volume is configured; metrics are lost if the Pod is recreated.

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

kube-state-metrics:
  metricLabelsAllowlist:
    - nodes=[node.kubernetes.io/instance-type,topology.kubernetes.io/region,topology.kubernetes.io/zone,failure-domain.beta.kubernetes.io/region,failure-domain.beta.kubernetes.io/zone,kubernetes.io/arch,kubernetes.io/os]
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  prometheus:
    monitor:
      # OpenCost joins node-exporter metrics to kube-state-metrics by node name.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# EKS control-plane components aren't exposed as ordinary in-cluster endpoints.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false
