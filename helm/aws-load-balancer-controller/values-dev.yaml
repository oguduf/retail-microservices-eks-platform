# Replace these placeholders with the cluster and AWS Region configured in GitHub Actions.
clusterName: <EKS_CLUSTER_NAME>
region: <AWS_REGION>

replicaCount: 2

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/<EKS_CLUSTER_NAME>-load-balancer-controller-role"
