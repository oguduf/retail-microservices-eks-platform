name: Deploy Event Producer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-producer-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful platform CI for the dev commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "::error::Select the dev branch for this deployment."
            exit 1
          fi
          if ! gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml --commit "$GITHUB_SHA" \
            --event push --status success \
            --json headSha,conclusion --limit 100 |
            jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .headSha == $sha and .conclusion == "success")' >/dev/null; then
            echo "::error::No successful platform CI push run was found for commit $GITHUB_SHA."
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GudufMonitoringEventProducer

      - name: Resolve deployment values from Terraform state
        working-directory: infrastructure/environments/dev
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=environments/dev/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true"

          if ! repository_urls="$(terraform output -json ecr_repository_urls)"; then
            echo "::error::Could not read ecr_repository_urls from Terraform state. Apply the current Terraform configuration first."
            exit 1
          fi

          if ! ECR_REPOSITORY_URI="$(jq -er '."monitoring-event-producer" | select(type == "string" and length > 0)' <<< "$repository_urls")"; then
            echo "::error::Terraform output ecr_repository_urls does not contain a valid monitoring-event-producer repository URI. Apply the current Terraform configuration first."
            exit 1
          fi

          EVENTS_QUEUE_URL="$(terraform output -raw monitoring_events_queue_url)"
          EVENT_PRODUCER_ROLE_ARN="$(terraform output -raw monitoring_event_producer_role_arn)"

          if [[ -z "$EVENTS_QUEUE_URL" || -z "$EVENT_PRODUCER_ROLE_ARN" ]]; then
            echo "::error::The Terraform state is missing the monitoring queue URL or event producer role ARN. Apply the current Terraform configuration first."
            exit 1
          fi

          {
            printf 'ECR_REPOSITORY_URI=%s\n' "$ECR_REPOSITORY_URI"
            printf 'EVENTS_QUEUE_URL=%s\n' "$EVENTS_QUEUE_URL"
            printf 'EVENT_PRODUCER_ROLE_ARN=%s\n' "$EVENT_PRODUCER_ROLE_ARN"
          } >> "$GITHUB_ENV"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up Trivy for image scan
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Build, scan, and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          : "${ECR_REPOSITORY_URI:?ECR_REPOSITORY_URI is empty; verify the Terraform output}"
          : "${IMAGE_TAG:?IMAGE_TAG is empty}"
          docker build --tag "$ECR_REPOSITORY_URI:$IMAGE_TAG" kubernetes/event-producer
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$ECR_REPOSITORY_URI:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
          echo "IMAGE_URI=$ECR_REPOSITORY_URI:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Connect to Amazon EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy event producer
        run: |
          kubectl apply -f kubernetes/namespaces/monitoring-dev.yaml
          sed "s|EVENT_PRODUCER_ROLE_ARN_PLACEHOLDER|$EVENT_PRODUCER_ROLE_ARN|g" kubernetes/event-producer/service-account.yaml.tpl | kubectl apply -f -
          sed -e "s|IMAGE_URI_PLACEHOLDER|$IMAGE_URI|g" -e "s|EVENTS_QUEUE_URL_PLACEHOLDER|$EVENTS_QUEUE_URL|g" kubernetes/event-producer/deployment.yaml.tpl | kubectl apply -f -

      - name: Verify event producer rollout
        run: kubectl rollout status deployment/event-producer --namespace monitoring-dev --timeout=5m
