
name: Deploy OpenCost to EKS

on:
  workflow_dispatch:
    inputs:
      restart_opencost:
        description: "Restart OpenCost after applying configuration to reload Prometheus metadata."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GudufOpenCost

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Connect to Amazon EKS
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Check Prometheus
        id: prometheus
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ALL KUBERNETES SERVICES ====="
          kubectl get svc -A

          mapfile -t matches < <(
            kubectl get svc -A -o json |
            jq -r '
              .items[]
              | select(
                  .metadata.name == "prometheus-server"
                  or (.metadata.name | endswith("-prometheus"))
                )
              | select(
                  any(
                    .spec.ports[]?;
                    .port == 80 or .port == 9090
                  )
                )
              | [
                  .metadata.namespace,
                  .metadata.name,
                  (
                    .spec.ports |
                    map(
                      select(
                        .port == 80 or .port == 9090
                      )
                    ) |
                    first |
                    .port
                  )
                ]
              | @tsv
            '
          )

          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one recognizable Prometheus service. Found ${#matches[@]}."
            exit 1
          fi

          IFS=$'\t' read -r ns svc port <<< "${matches[0]}"

          echo "namespace=$ns" >> "$GITHUB_OUTPUT"
          echo "service=$svc" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

          echo "Prometheus namespace: $ns"
          echo "Prometheus service: $svc"
          echo "Prometheus port: $port"

      - name: Install OpenCost
        shell: bash
        run: |
          set -euo pipefail

          helm repo add opencost \
            https://opencost.github.io/opencost-helm-chart

          helm repo update

          helm upgrade --install opencost opencost/opencost \
            --namespace opencost \
            --create-namespace \
            --values helm/opencost-values-dev.yaml \
            --wait \
            --timeout 5m \
            --set opencost.ui.enabled=true \
            --set-string opencost.prometheus.internal.namespaceName="${{ steps.prometheus.outputs.namespace }}" \
            --set-string opencost.prometheus.internal.serviceName="${{ steps.prometheus.outputs.service }}" \
            --set opencost.prometheus.internal.port="${{ steps.prometheus.outputs.port }}"

      - name: Restart OpenCost to reload Prometheus metadata
        if: ${{ inputs.restart_opencost }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout restart deployment/opencost -n opencost
          kubectl rollout status deployment/opencost -n opencost --timeout=5m

      - name: Verify OpenCost
        shell: bash
        run: |
          set -euo pipefail

          echo "===== OPEN COST PODS ====="
          kubectl get pods -n opencost

          echo "===== OPEN COST SERVICES ====="
          kubectl get svc -n opencost

          echo "===== OPEN COST ROLLOUT ====="
          kubectl rollout status \
            deployment/opencost \
            -n opencost \
            --timeout=5m

      - name: Diagnose OpenCost and Prometheus
        shell: bash
        env:
          PROM_NAMESPACE: ${{ steps.prometheus.outputs.namespace }}
          PROM_SERVICE: ${{ steps.prometheus.outputs.service }}
          PROM_PORT: ${{ steps.prometheus.outputs.port }}
        run: |
          set -euo pipefail

          echo "===== PROMETHEUS CONFIGURATION ====="

          kubectl get deployment opencost \
            -n opencost \
            -o json | jq -r '
              .spec.template.spec.containers[]
              | .name as $container
              | .env[]?
              | select(
                  .name |
                  test("PROMETHEUS|CLUSTER_ID")
                )
              | "\($container): \(.name)=\(.value // "valueFrom")"
            '

          echo "===== OPEN COST SERVICES ====="
          kubectl get svc -n opencost

          echo "===== OPEN COST API HEALTH ====="

          kubectl run opencost-api-check \
            -n opencost \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm -i \
            --pod-running-timeout=90s \
            --command -- \
            curl -sS -i --max-time 20 \
            http://opencost.opencost.svc.cluster.local:9003/healthz

          echo "===== OPEN COST ALLOCATION API ====="

          kubectl run opencost-allocation-check \
            -n opencost \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm -i \
            --pod-running-timeout=90s \
            --command -- \
            curl -sS --max-time 30 \
            "http://opencost.opencost.svc.cluster.local:9003/allocation/compute?window=1h"

          echo "===== PROMETHEUS API HEALTH ====="

          kubectl run opencost-prometheus-check \
            -n opencost \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm -i \
            --pod-running-timeout=90s \
            --env="PROM_NAMESPACE=$PROM_NAMESPACE" \
            --env="PROM_SERVICE=$PROM_SERVICE" \
            --env="PROM_PORT=$PROM_PORT" \
            --command -- \
            sh -c '
              curl -sS --max-time 20 \
                "http://${PROM_SERVICE}.${PROM_NAMESPACE}.svc.cluster.local:${PROM_PORT}/api/v1/query?query=up"
            '

          echo "===== OPEN COST LOGS ====="

          kubectl logs deployment/opencost \
            -n opencost \
            -c opencost \
            --tail=80

      - name: Show diagnostics if workflow fails
        if: failure()
        shell: bash
        run: |
          echo "===== OPEN COST PODS ====="
          kubectl get pods -n opencost -o wide || true

          echo "===== OPEN COST DEPLOYMENT ====="
          kubectl describe deployment opencost \
            -n opencost || true

          echo "===== OPEN COST LOGS ====="
          kubectl logs deployment/opencost \
            -n opencost \
            -c opencost \
            --tail=100 || true

          echo "===== RECENT EVENTS ====="
          kubectl get events \
            -n opencost \
            --sort-by=.lastTimestamp | tail -40 || true
