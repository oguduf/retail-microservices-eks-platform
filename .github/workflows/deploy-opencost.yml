
name: Deploy OpenCost to EKS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GudufOpenCost

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Connect to Amazon EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Check Prometheus
        id: prometheus
        shell: bash
        run: |
          set -euo pipefail

          kubectl get svc -A

          mapfile -t matches < <(
            kubectl get svc -A -o json |
            jq -r '
              .items[]
              | select(
                  .metadata.name == "prometheus-server"
                  or (.metadata.name | endswith("-prometheus"))
                )
              | select(any(.spec.ports[]?; .port == 80 or .port == 9090))
              | [.metadata.namespace,
                 .metadata.name,
                 (.spec.ports |
                   map(select(.port == 80 or .port == 9090)) |
                   first | .port)]
              | @tsv
            '
          )

          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one recognizable Prometheus service. Found ${#matches[@]}. Configure the endpoint before deploying."
            exit 1
          fi

          IFS=$'\t' read -r ns svc port <<< "${matches[0]}"

          echo "namespace=$ns" >> "$GITHUB_OUTPUT"
          echo "service=$svc" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Install OpenCost
        shell: bash
        run: |
          set -euo pipefail

          helm repo add opencost \
            https://opencost.github.io/opencost-helm-chart
          helm repo update

          helm upgrade --install opencost opencost/opencost \
            --namespace opencost \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set opencost.ui.enabled=true \
            --set-string opencost.prometheus.internal.namespaceName="${{ steps.prometheus.outputs.namespace }}" \
            --set-string opencost.prometheus.internal.serviceName="${{ steps.prometheus.outputs.service }}" \
            --set opencost.prometheus.internal.port="${{ steps.prometheus.outputs.port }}"

      - name: Verify OpenCost
        run: |
          kubectl get pods -n opencost
          kubectl get svc -n opencost
          kubectl rollout status \
            deployment/opencost \
            -n opencost \
            --timeout=5m
