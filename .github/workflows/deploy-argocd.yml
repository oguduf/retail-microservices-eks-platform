name: Deploy Argo CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

    steps:
      - name: Require the dev branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "::error::Select the dev branch when running this workflow."
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: DeployArgoCD

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.36.1

      - name: Connect to Amazon EKS
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Install Argo CD
        shell: bash
        run: |
          set -euo pipefail

          kubectl create namespace argocd \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply \
            --namespace argocd \
            --server-side \
            --force-conflicts \
            --filename https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml

          kubectl wait \
            --for=condition=Ready \
            pods \
            --all \
            --namespace argocd \
            --timeout=10m

          kubectl get deployments,statefulsets,pods \
            --namespace argocd \
            --output wide
