name: Deploy Prometheus and Grafana

on:
  workflow_dispatch:
    inputs:
      grafana_access:
        description: "Keep Grafana private or expose it through authenticated HTTPS."
        required: true
        type: choice
        options:
          - private
          - public-https
        default: private

permissions:
  contents: read

concurrency:
  group: prometheus-grafana-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  GRAFANA_ACCESS: ${{ inputs.grafana_access }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful platform CI for the dev commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "::error::Select the dev branch for this deployment."
            exit 1
          fi
          if ! gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml --commit "$GITHUB_SHA" \
            --event push --status success \
            --json headSha,conclusion --limit 100 |
            jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .headSha == $sha and .conclusion == "success")' >/dev/null; then
            echo "::error::No successful platform CI push run was found for commit $GITHUB_SHA."
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GudufRetailPrometheusGrafanaDev

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.36.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Connect to Amazon EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Create namespace and Grafana credential Secret
        shell: bash
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$GRAFANA_ADMIN_PASSWORD" ]]; then
            echo "::error::Add the GRAFANA_ADMIN_PASSWORD Actions secret before running this workflow."
            exit 1
          fi
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic grafana-admin \
            --namespace observability \
            --from-literal=admin-user=admin \
            --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install pinned kube-prometheus-stack chart
        shell: bash
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community
          values_args=()
          if [[ "$GRAFANA_ACCESS" == "public-https" ]]; then
            values_args+=(--values helm/prometheus-grafana/values-public-https.yaml)
          fi
          helm upgrade --install prometheus-grafana prometheus-community/kube-prometheus-stack \
            --namespace observability \
            --version 92.3.0 \
            --values helm/prometheus-grafana/values-dev.yaml \
            "${values_args[@]}" \
            --wait --timeout 15m

      - name: Verify monitoring workloads and services
        shell: bash
        run: |
          set -euo pipefail
          kubectl get pods,svc --namespace observability --output wide
          kubectl get prometheus,servicemonitors --namespace observability
          kubectl get ingress --namespace observability --output wide
          if [[ "$GRAFANA_ACCESS" == "public-https" ]]; then
            ingress_name=""
            ingress_hostname=""
            for attempt in {1..60}; do
              ingress_name="$(kubectl get ingress --namespace observability --output jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
              if [[ -n "$ingress_name" ]]; then
                ingress_hostname="$(kubectl get ingress "$ingress_name" --namespace observability --output jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
              fi
              if [[ -n "$ingress_hostname" ]]; then
                break
              fi
              sleep 10
            done
            if [[ -z "$ingress_hostname" ]]; then
              echo "::error::Grafana Ingress has no ALB hostname yet. Check its Kubernetes events and confirm the ACM certificate is issued in $AWS_REGION."
              exit 1
            fi
            {
              echo "## Grafana HTTPS endpoint setup"
              echo "The ALB hostname is: `$ingress_hostname`."
              echo "In Route 53, create an A record named `grafana.omergroup.click`, enable Alias, and route it to this Application Load Balancer in `$AWS_REGION`."
              echo "After DNS propagates, open https://grafana.omergroup.click and sign in as `admin` using the `GRAFANA_ADMIN_PASSWORD` Actions secret."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnose deployment failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          kubectl get pods,svc,pvc --namespace observability --output wide
          kubectl get events --namespace observability --sort-by=.lastTimestamp | tail -n 60
          exit 0
