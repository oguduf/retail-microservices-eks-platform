name: Infracost Scan
# Managed by infracost ci setup v1 — re-run `infracost ci setup --pipeline` to update.

on:
  push:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  infracost-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Infracost CLI
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: "2.x"

      - name: Run Infracost Scan
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          infracost scan infrastructure/environments/dev --json > "$RUNNER_TEMP/infracost-scan.json"
          infracost inspect --file "$RUNNER_TEMP/infracost-scan.json" --summary > "$RUNNER_TEMP/infracost-summary.txt"
          {
            echo "## Infracost cost scan"
            echo
            echo "Branch: \`$GITHUB_REF_NAME\`  "
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/infracost-summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
