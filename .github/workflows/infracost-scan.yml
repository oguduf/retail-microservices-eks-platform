name: Infracost Scan
# Managed by infracost ci setup v1 — re-run `infracost ci setup --pipeline` to update.

on:
  push:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  infracost-scan:
    runs-on: ubuntu-latest
    container: ghcr.io/infracost/ci:0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Infracost Scan
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          infracost-ci scan --path . 2>&1 | tee "$RUNNER_TEMP/infracost-scan.txt"
          {
            echo "## Infracost cost scan"
            echo
            echo "Branch: \`$GITHUB_REF_NAME\`  "
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/infracost-scan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
