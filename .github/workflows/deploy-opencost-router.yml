
name: Deploy OpenCost Router

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Retrieve the official NGINX image digest
      - name: Get NGINX image digest
        shell: bash
        run: |
          set -euo pipefail

          echo "Retrieving NGINX image digest..."

          docker buildx imagetools inspect \
            nginxinc/nginx-unprivileged:1.27-alpine

          echo "Digest inspection completed."

      # Step 3: Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 4: Connect to EKS
      - name: Connect to EKS
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      # Step 5: Confirm current router is running
      - name: Check existing OpenCost router
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking existing OpenCost router deployment..."

          kubectl get deployment opencost-router \
            -n opencost

          echo "Checking existing router pods..."

          kubectl get pods \
            -n opencost \
            -l app=opencost-router

          echo "Checking existing router service..."

          kubectl get svc opencost-router \
            -n opencost

          echo "No deployment changes were made."
