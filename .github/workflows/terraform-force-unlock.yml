name: Terraform State Force Unlock

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: "Exact Terraform lock ID from the failed or cancelled run."
        required: true
        type: string
      confirm_no_active_run:
        description: "Confirm the original Terraform run is fully stopped."
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  id-token: write

# Serialize this operation with the normal Terraform workflow using the same state.
concurrency:
  group: terraform-development
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true

jobs:
  force-unlock:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/environments/dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate unlock request
        shell: bash
        env:
          TF_LOCK_ID: ${{ inputs.lock_id }}
          CONFIRM_NO_ACTIVE_RUN: ${{ inputs.confirm_no_active_run }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "::error::Run this workflow from the dev branch only."
            exit 1
          fi
          if [[ "$CONFIRM_NO_ACTIVE_RUN" != "yes" ]]; then
            echo "::error::Confirm that the original Terraform run is fully stopped."
            exit 1
          fi
          if [[ ! "$TF_LOCK_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::The lock ID must be a UUID. Copy the exact ID from Terraform's lock error."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GudufRetailEksTerraformForceUnlock

      - name: Initialize Terraform remote state
        run: terraform init -input=false -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=environments/dev/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true"

      - name: Release the specified Terraform lock
        shell: bash
        env:
          TF_LOCK_ID: ${{ inputs.lock_id }}
        run: terraform force-unlock -force "$TF_LOCK_ID"
