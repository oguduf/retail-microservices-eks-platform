name: Infracost Diff

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to scan
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-details:
    runs-on: ubuntu-latest
    outputs:
      base-ref: ${{ steps.resolve.outputs.base-ref }}
      head-ref: ${{ steps.resolve.outputs.head-ref }}
      head-repository: ${{ steps.resolve.outputs.head-repository }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
    steps:
      - name: Resolve pull request details
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_PR_NUMBER" ]]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json baseRefName,headRefName,headRepository)
            BASE_REF=$(jq -r '.baseRefName' <<< "$PR_JSON")
            HEAD_REF=$(jq -r '.headRefName' <<< "$PR_JSON")
            HEAD_REPOSITORY=$(jq -r '.headRepository.nameWithOwner // empty' <<< "$PR_JSON")
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            BASE_REF="$EVENT_BASE_REF"
            HEAD_REF="$EVENT_HEAD_REF"
            HEAD_REPOSITORY="$EVENT_HEAD_REPOSITORY"
          fi
          if [[ -z "$HEAD_REPOSITORY" ]]; then
            HEAD_REPOSITORY="$GITHUB_REPOSITORY"
          fi
          {
            echo "base-ref=$BASE_REF"
            echo "head-ref=$HEAD_REF"
            echo "head-repository=$HEAD_REPOSITORY"
            echo "pr-number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

  infracost-diff:
    needs: pr-details
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.pr-details.outputs.head-repository }}
          ref: ${{ needs.pr-details.outputs.head-ref }}
          path: head

      - name: Checkout pull request merge ref
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base branch
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pr-details.outputs.base-ref }}
          path: base

      - name: Use the same Infracost project config for both branches
        if: github.event.action != 'closed'
        shell: bash
        run: cp head/infracost.yml base/infracost.yml

      - name: Run Infracost Diff
        uses: infracost/actions/diff@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          # Root paths let Infracost load the root config and keep local modules
          # within each checkout's scan boundary; infracost.yml selects dev.
          base-path: base
          head-path: head
          project: dev
          pr-number: ${{ needs.pr-details.outputs.pr-number }}
          pr-status: ${{ github.event_name == 'workflow_dispatch' && 'OPEN' || '' }}

      - name: Add Infracost report to Actions summary
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          INFRACOST_PR_NUMBER: ${{ needs.pr-details.outputs.pr-number }}
        shell: bash
        run: |
          set -euo pipefail
          report=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$INFRACOST_PR_NUMBER/comments?per_page=100" \
            | jq -r '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains("Infracost report")))] | sort_by(.updated_at) | last | .body // empty')

          {
            echo "## Infracost PR cost diff"
            echo
            echo "This report compares the PR branch with its base branch. It shows the cost change introduced by the PR, not the full monthly cost reported by the push-to-dev scan."
            echo
            echo "PR #$INFRACOST_PR_NUMBER report, copied from the Infracost PR comment:"
            echo
            if [[ -n "$report" ]]; then
              printf '%s\n' "$report"
            else
              echo "No Infracost report comment was found. Check the PR Conversation tab and the diff action logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
