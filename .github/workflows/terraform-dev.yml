name: Terraform Infrastructure Development

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose whether to preview or apply development infrastructure changes."
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-development
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/environments/dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GudufRetailEksTerraformDev

      - name: Initialize Terraform remote state
        run: terraform init -input=false -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=environments/dev/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true"

      - name: Format and validate Terraform
        run: |
          terraform fmt -check -recursive ../..
          terraform validate

      - name: Create Terraform plan
        run: terraform plan -input=false -out=tfplan -var="aws_region=${{ vars.AWS_REGION }}" -var="project_name=${{ vars.PROJECT_NAME }}" -var="environment=${{ vars.ENVIRONMENT }}"

      - name: Apply Terraform plan
        if: ${{ inputs.operation == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan
