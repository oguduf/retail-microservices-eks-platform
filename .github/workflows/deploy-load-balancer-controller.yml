name: Deploy AWS Load Balancer Controller

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful platform CI for the dev commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "::error::Select the dev branch for this deployment."
            exit 1
          fi
          if ! gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml --commit "$GITHUB_SHA" \
            --event push --status success \
            --json headSha,conclusion --limit 100 |
            jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .headSha == $sha and .conclusion == "success")' >/dev/null; then
            echo "::error::No successful platform CI push run was found for commit $GITHUB_SHA."
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GudufRetailEksPlatform

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Connect to Amazon EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Install AWS Load Balancer Controller
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --create-namespace \
            --version 1.14.0 \
            --values helm/aws-load-balancer-controller/values-dev.yaml

      - name: Verify controller rollout
        run: kubectl rollout status deployment/aws-load-balancer-controller --namespace kube-system --timeout=5m
