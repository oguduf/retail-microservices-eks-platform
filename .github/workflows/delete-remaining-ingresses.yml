name: Delete Remaining Project Ingresses

on:
  workflow_dispatch:
    inputs:
      confirm_ingresses:
        description: "Type delete-argocd-opencost-ingresses to remove only the Argo CD and OpenCost Ingresses and their controller-managed ALBs"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: delete-remaining-project-ingresses
  cancel-in-progress: false

jobs:
  delete-ingresses:
    name: Delete Argo CD and OpenCost Ingresses
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 25
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

    steps:
      - name: Require dev branch and explicit confirmation
        shell: bash
        env:
          CONFIRM_INGRESSES: ${{ inputs.confirm_ingresses }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "::error::Select the dev branch when running this workflow."
            exit 1
          fi
          if [[ "$CONFIRM_INGRESSES" != "delete-argocd-opencost-ingresses" ]]; then
            echo "::error::Confirmation did not match. No resources were changed."
            exit 1
          fi
          if [[ "$AWS_REGION" != "us-east-2" || "$EKS_CLUSTER_NAME" != "guduf-retail-eks-dev" ]]; then
            echo "::error::Configured region or cluster does not match the expected development cluster. No resources were changed."
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: DeleteRemainingProjectIngresses

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.36.1

      - name: Connect to Amazon EKS
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != "866934333672" ]]; then
            echo "::error::AWS role resolved to unexpected account $account_id. No resources were changed."
            exit 1
          fi
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl get namespace argocd
          kubectl get namespace opencost

      - name: Verify and delete only the remaining project Ingresses
        shell: bash
        run: |
          set -euo pipefail

          delete_expected_ingress() {
            local namespace="$1"
            local ingress_name="$2"
            local expected_host="$3"
            local expected_lb_prefix="$4"
            local ingress_json host load_balancer

            ingress_json="$(kubectl get ingress "$ingress_name" \
              --namespace "$namespace" --ignore-not-found=true --output json)"
            if [[ -z "$ingress_json" ]]; then
              echo "Ingress $namespace/$ingress_name is already absent; skipping."
              return 0
            fi

            host="$(jq -r '.spec.rules[]?.host // empty' <<< "$ingress_json" | head -n 1)"
            load_balancer="$(jq -r '.status.loadBalancer.ingress[0].hostname // empty' <<< "$ingress_json")"
            if [[ "$host" != "$expected_host" ]]; then
              echo "::error::Expected $namespace/$ingress_name host $expected_host; found '${host:-none}'. No resources were changed for this Ingress."
              return 1
            fi
            if [[ "$load_balancer" != "$expected_lb_prefix"*.us-east-2.elb.amazonaws.com ]]; then
              echo "::error::Unexpected load balancer for $namespace/$ingress_name: '${load_balancer:-none}'. No resources were changed for this Ingress."
              return 1
            fi
            if [[ "$(kubectl auth can-i delete "ingress/$ingress_name" --namespace "$namespace")" != "yes" ]]; then
              echo "::error::The GitHub Actions role cannot delete $namespace/$ingress_name. No resources were changed for this Ingress."
              return 1
            fi

            echo "Deleting $namespace/$ingress_name for $host ($load_balancer)."
            kubectl delete ingress "$ingress_name" \
              --namespace "$namespace" --wait=true --timeout=10m
            if kubectl get ingress "$ingress_name" --namespace "$namespace" >/dev/null 2>&1; then
              echo "::error::Ingress $namespace/$ingress_name remains. Check its finalizer and AWS Load Balancer Controller."
              return 1
            fi
          }

          delete_expected_ingress \
            argocd argocd-server argocd.omergroup.click k8s-argocd-argocdse-
          delete_expected_ingress \
            opencost opencost-auth-ingress opencost.omergroup.click k8s-opencost-opencost-

          echo "Both remaining project Ingresses are absent. Their controller-managed ALBs should be removed."
