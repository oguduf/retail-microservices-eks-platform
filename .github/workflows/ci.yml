name: Platform CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Format, initialize without a backend, and validate
        working-directory: infrastructure/environments/dev
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false -input=false
          terraform validate

  prometheus-grafana-helm-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Render pinned monitoring chart with development values
        shell: bash
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community
          helm template prometheus-grafana prometheus-community/kube-prometheus-stack \
            --namespace observability \
            --version 92.3.0 \
            --values helm/prometheus-grafana/values-dev.yaml \
            --include-crds > /tmp/prometheus-grafana-rendered.yaml
          grep -q 'name: grafana-cloudwatch' /tmp/prometheus-grafana-rendered.yaml
          grep -q 'type: cloudwatch' /tmp/prometheus-grafana-rendered.yaml
          grep -q 'uid: cloudwatch' /tmp/prometheus-grafana-rendered.yaml
          helm template prometheus-grafana prometheus-community/kube-prometheus-stack \
            --namespace observability \
            --version 92.3.0 \
            --values helm/prometheus-grafana/values-dev.yaml \
            --values helm/prometheus-grafana/values-public-https.yaml \
            --include-crds > /tmp/prometheus-grafana-public-rendered.yaml

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov - scan Terraform, Kubernetes, Docker, and workflow configuration
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          output_format: cli
          quiet: true
          soft_fail: false

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  event-producer-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Build and scan the event-producer image
        shell: bash
        run: |
          set -euo pipefail
          image="event-producer-ci:${GITHUB_SHA}"
          docker build --tag "$image" kubernetes/event-producer
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
