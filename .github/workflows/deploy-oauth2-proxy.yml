
name: Deploy OpenCost OAuth2 Proxy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GudufOAuth2Proxy

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Connect to Amazon EKS
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify OpenCost namespace
        shell: bash
        run: |
          set -euo pipefail

          kubectl get namespace opencost
          kubectl get services -n opencost

      - name: Inspect OpenCost service ports
        shell: bash
        run: |
          set -euo pipefail

          echo "===== OPEN COST SERVICES ====="
          kubectl get svc -n opencost

          echo "===== OPEN COST SERVICE DETAILS ====="
          kubectl describe svc opencost -n opencost

          echo "===== OPEN COST PODS ====="
          kubectl get pods -n opencost

          echo "===== OPEN COST ENDPOINTS ====="
          kubectl get endpointslice \
            -n opencost \
            -l kubernetes.io/service-name=opencost

      - name: Validate OAuth credentials
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.OPEN_COST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.OPEN_COST_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.OPEN_COST_COOKIE_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::Missing OPEN_COST_CLIENT_ID"
            exit 1
          fi

          if [[ -z "$CLIENT_SECRET" ]]; then
            echo "::error::Missing OPEN_COST_CLIENT_SECRET"
            exit 1
          fi

          if [[ -z "$COOKIE_SECRET" ]]; then
            echo "::error::Missing OPEN_COST_COOKIE_SECRET"
            exit 1
          fi

          if [[ ! "$COOKIE_SECRET" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::Cookie secret must be 32 lowercase hexadecimal characters."
            exit 1
          fi

          echo "OAuth credentials and cookie secret validated."

      - name: Create OAuth2 Proxy Kubernetes Secret
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.OPEN_COST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.OPEN_COST_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.OPEN_COST_COOKIE_SECRET }}
        run: |
          set -euo pipefail

          kubectl create secret generic oauth2-proxy-secrets \
            --namespace opencost \
            --from-literal=client-id="$CLIENT_ID" \
            --from-literal=client-secret="$CLIENT_SECRET" \
            --from-literal=cookie-secret="$COOKIE_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "OAuth2 Proxy Kubernetes Secret updated."

      - name: Add OAuth2 Proxy Helm repository
        shell: bash
        run: |
          set -euo pipefail

          helm repo add oauth2-proxy \
            https://oauth2-proxy.github.io/manifests

          helm repo update

      - name: Deploy OAuth2 Proxy
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install oauth2-proxy \
            oauth2-proxy/oauth2-proxy \
            --namespace opencost \
            --set config.existingSecret=oauth2-proxy-secrets \
            --set extraArgs.provider=github \
            --set extraArgs.reverse-proxy=true \
            --set extraArgs.email-domain="*" \
            --set extraArgs.github-user=oguduf \
            --set-string extraArgs.upstream="http://opencost.opencost.svc.cluster.local:9003" \
            --set-string extraArgs.redirect-url="https://opencost.omergroup.click/oauth2/callback" \
            --set extraArgs.cookie-secure=true \
            --set extraArgs.cookie-httponly=true \
            --set extraArgs.cookie-samesite=lax \
            --set service.type=ClusterIP \
            --timeout 5m

      - name: Restart OAuth2 Proxy to load updated Secret
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout restart \
            deployment/oauth2-proxy \
            --namespace opencost

          kubectl rollout status \
            deployment/oauth2-proxy \
            --namespace opencost \
            --timeout=5m

      - name: Diagnose OAuth2 Proxy deployment
        if: failure()
        shell: bash
        run: |
          echo "===== HELM STATUS ====="
          helm status oauth2-proxy -n opencost || true

          echo "===== POD STATUS ====="
          kubectl get pods -n opencost -o wide || true

          echo "===== DEPLOYMENT STATUS ====="
          kubectl get deployments -n opencost || true

          echo "===== OAUTH2 PROXY LOGS ====="
          kubectl logs \
            -n opencost \
            deployment/oauth2-proxy \
            -c oauth2-proxy \
            --tail=80 || true

          echo "===== PREVIOUS CRASH LOGS ====="
          kubectl logs \
            -n opencost \
            deployment/oauth2-proxy \
            -c oauth2-proxy \
            --previous \
            --tail=100 || true

          echo "===== RECENT KUBERNETES EVENTS ====="
          kubectl get events \
            -n opencost \
            --sort-by=.lastTimestamp | tail -40 || true

      - name: Verify OAuth2 Proxy deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== OAUTH2 PROXY PODS ====="
          kubectl get pods -n opencost

          echo "===== SERVICES ====="
          kubectl get svc -n opencost

          echo "===== DEPLOYMENT ROLLOUT ====="
          kubectl rollout status \
            deployment/oauth2-proxy \
            --namespace opencost \
            --timeout=5m

          echo "OAuth2 Proxy deployment successful."
