name: Delete Coffee Store Ingress

on:
  workflow_dispatch:
    inputs:
      confirm_ingress:
        description: "Type coffee-store-ingress to delete only the coffee-store Ingress and let AWS Load Balancer Controller remove its ALB"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: delete-coffee-store-ingress
  cancel-in-progress: false

jobs:
  delete-ingress:
    name: Delete coffee-store Ingress
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

    steps:
      - name: Require the dev branch and explicit confirmation
        shell: bash
        env:
          CONFIRM_INGRESS: ${{ inputs.confirm_ingress }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "::error::Select the dev branch when running this workflow."
            exit 1
          fi
          if [[ "$CONFIRM_INGRESS" != "coffee-store-ingress" ]]; then
            echo "::error::Confirmation did not match. No resources were changed."
            exit 1
          fi
          if [[ "$AWS_REGION" != "us-east-2" || "$EKS_CLUSTER_NAME" != "guduf-retail-eks-dev" ]]; then
            echo "::error::Configured region or cluster does not match the expected development cluster. No resources were changed."
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: DeleteCoffeeStoreIngress

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.36.1

      - name: Connect to Amazon EKS
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != "866934333672" ]]; then
            echo "::error::AWS role resolved to unexpected account $account_id. No resources were changed."
            exit 1
          fi
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"
          kubectl get namespace coffee-store

      - name: Verify and delete only the expected Ingress
        shell: bash
        run: |
          set -euo pipefail

          ingress_json="$(kubectl get ingress coffee-store \
            --namespace coffee-store \
            --output json)"
          host="$(jq -r '.spec.rules[]?.host // empty' <<< "$ingress_json" | head -n 1)"
          load_balancer="$(jq -r '.status.loadBalancer.ingress[0].hostname // empty' <<< "$ingress_json")"

          if [[ "$host" != "omergroup.click" ]]; then
            echo "::error::Expected coffee-store Ingress host omergroup.click; found '${host:-none}'. No resources were changed."
            exit 1
          fi
          if [[ "$load_balancer" != k8s-coffeest-coffeest-*.us-east-2.elb.amazonaws.com ]]; then
            echo "::error::Ingress does not point to the expected Coffee Store ALB. Found '${load_balancer:-none}'. No resources were changed."
            exit 1
          fi

          echo "Verified target: ingress/coffee-store in namespace coffee-store"
          echo "Host: $host"
          echo "Load balancer: $load_balancer"

          if [[ "$(kubectl auth can-i delete ingress/coffee-store --namespace coffee-store)" != "yes" ]]; then
            echo "::error::The GitHub Actions role cannot delete this Ingress in Kubernetes. No resources were changed. Update its EKS access/RBAC permissions, then rerun this workflow."
            exit 1
          fi

          kubectl delete ingress coffee-store \
            --namespace coffee-store \
            --wait=true \
            --timeout=10m

          if kubectl get ingress coffee-store --namespace coffee-store >/dev/null 2>&1; then
            echo "::error::Ingress still exists after deletion wait. Check its finalizer and AWS Load Balancer Controller logs."
            exit 1
          fi

          echo "Ingress deletion completed. The AWS Load Balancer Controller should now remove the associated Coffee Store ALB."
